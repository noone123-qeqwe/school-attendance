# Render Blueprint for Smart Classroom Attendance System
# Documentation: https://render.com/docs/blueprint-spec

databases:
  - name: attendance-db
    databaseName: attendance
    user: attendance_user
    plan: free

services:
  - type: web
    name: attendance-system
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: "Smart Classroom Attendance System"
      - key: APP_SUBTITLE
        value: "QR, GPS, and Biometric-Based Attendance Monitoring"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_TIMEZONE
        value: Asia/Manila
      - key: APP_URL
        fromService:
          type: web
          name: attendance-system
          property: host
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: TRUSTED_PROXIES
        value: "*"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: attendance-db
          property: connectionString