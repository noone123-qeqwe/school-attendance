name: Automatic Application Versioning

on:
  workflow_run:
    workflows: ["Laravel CI Test Suite"]
    types: [completed]
    branches: [main]

concurrency:
  group: auto-version-bump-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  auto_version_bump:
    name: Release verified main updates
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    steps:
      - name: Check out the commit that passed CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, json, pdo, pdo_sqlite
          coverage: none

      - name: Configure release bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Confirm this verified commit is still the tip of main
        id: release_check
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          MAIN_SHA="$(git rev-parse FETCH_HEAD)"
          if [[ "$MAIN_SHA" != "$TESTED_SHA" ]]; then
            echo "The tested commit is no longer the tip of main; a newer CI run will release the latest commit."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COMMIT_MESSAGE="$(git show -s --format=%s "$TESTED_SHA")"
          if [[ "$COMMIT_MESSAGE" == *"[skip ci]"* || "$COMMIT_MESSAGE" == *"[ci skip]"* || "$COMMIT_MESSAGE" == *"chore(release):"* ]]; then
            echo "This commit is marked to skip CI or is already a release commit."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff-tree --no-commit-id --name-only -r -m "$TESTED_SHA" | grep -qx 'version.json'; then
            echo "This commit already changed version.json; skipping the automatic bump."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"

      - name: Increment the verified web release version
        id: bump
        if: steps.release_check.outputs.should_release == 'true'
        run: php scripts/version-bump.php --ci --release

      - name: Set up Node
        if: steps.bump.outputs.bumped == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build and validate release assets
        if: steps.bump.outputs.bumped == 'true'
        run: |
          npm ci
          npm run build
          php scripts/check-release-manifest.php

      - name: Commit and publish the release
        if: steps.bump.outputs.bumped == 'true'
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          if [[ "$(git rev-parse FETCH_HEAD)" != "$TESTED_SHA" ]]; then
            echo "main advanced while the release was being prepared; refusing to publish a stale release."
            exit 1
          fi

          git add version.json package.json package-lock.json public/manifest.json public/sw.js
          git commit -m "chore(release): bump version to ${NEW_VERSION} [skip ci]"
          git tag -a "v${NEW_VERSION}" -m "Release v${NEW_VERSION}"
          git push origin HEAD:main --follow-tags
