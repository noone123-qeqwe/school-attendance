[global]
daemonize = no
error_log = /proc/self/fd/2

[www]
user = www-data
group = www-data
listen = /var/run/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0666

clear_env = no

; ── Process Manager ──────────────────────────────────────────
; Dynamic workers reduce idle memory use and can be tuned per instance with
; PHP_FPM_MAX_CHILDREN, PHP_FPM_START_SERVERS, and spare-server env settings.
pm = dynamic
pm.max_children = 4
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
listen.backlog = 128

; ── Logging (minimal) ────────────────────────────────────────
access.log = /dev/null
catch_workers_output = yes
decorate_workers_output = no

; ── Request Limits ───────────────────────────────────────────
request_terminate_timeout = 60s
