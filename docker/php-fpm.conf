[global]
daemonize = no
error_log = /proc/self/fd/2

[www]
user = www-data
group = www-data
listen = /var/run/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0666

clear_env = no

; ── Process Manager ──────────────────────────────────────────
; Use "static" to avoid the overhead of forking/killing workers
; Render free-tier has ~512MB RAM; 4 static workers is optimal
pm = static
pm.max_children = 4
pm.max_requests = 500

; ── Logging (minimal) ────────────────────────────────────────
access.log = /dev/null
catch_workers_output = yes
decorate_workers_output = no

; ── Request Limits ───────────────────────────────────────────
request_terminate_timeout = 60s
