<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/design-tokens.css">
    <link rel="stylesheet" href="css/premium.css">
    <link rel="stylesheet" href="css/dashboard-enterprise.css">
    <link rel="stylesheet" href="css/mobile-enterprise.css">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.21/index.global.min.js"></script>
    <style>
        .fc-day-sat, th.fc-day-sat, td.fc-day-sat { display: table-cell !important; }
        .fc-scrollgrid th:last-child, .fc-scrollgrid td:last-child { display: table-cell !important; }
        .fc-scrollgrid th:nth-child(7), .fc-scrollgrid td:nth-child(7) { display: table-cell !important; }
    </style>
</head>
<body>
    <div id="calendar" style="min-height: 600px; min-width: 700px;"></div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var calendarEl = document.getElementById('calendar');
            var calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                initialDate: new Date(2026, 7, 1),
                headerToolbar: false,
                height: 'auto',
                firstDay: 0,
                weekends: true,
                fixedWeekCount: false
            });
            calendar.render();
            
            setTimeout(() => {
                var headers = Array.from(document.querySelectorAll('.fc-col-header-cell-cushion')).map(e => e.innerText).join(', ');
                var div = document.createElement('div');
                div.id = 'debug-headers';
                div.innerText = 'Headers: ' + headers;
                document.body.appendChild(div);
                
                var satDays = document.querySelectorAll('.fc-day-sat');
                var satDisplay = satDays.length > 0 ? window.getComputedStyle(satDays[0]).display : 'Element not found';
                var div2 = document.createElement('div');
                div2.id = 'debug-sat';
                div2.innerText = 'Sat Display: ' + satDisplay;
                document.body.appendChild(div2);
                
                // Also check if any styles hide it
                var satTh = document.querySelectorAll('th:nth-child(7)');
                var satThDisplay = satTh.length > 0 ? window.getComputedStyle(satTh[0]).display : 'No th:nth-child(7)';
                var div3 = document.createElement('div');
                div3.id = 'debug-th';
                div3.innerText = 'TH 7th Display: ' + satThDisplay;
                document.body.appendChild(div3);
            }, 1000);
        });
    </script>
</body>
</html>
